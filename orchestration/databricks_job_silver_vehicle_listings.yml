# Databricks Job "silver_vehicle_listings": the Silver pipeline of the four vehicle listing sources.
#
# Exported from the Databricks UI ("View as code", Databricks Asset Bundle format). Earlier name: silver_daily
# (same Job ID); the service_events task moved to its own Job silver_service_events, because the
# mentor wants the service book run through ADF. One change to the export: the notebook paths are relative to
# this file instead of the personal workspace Git folder (/Workspace/Users/<user>/used-cars-pipeline/notebooks/...),
# so the file contains no user name and can be deployed with `databricks bundle deploy` from the repository.
#
# Task graph:
#   validate_landing_and_bronze (01, sources=vehicle_listings: 4 vehicle sources + brand lookup)
#    ├─ stage_first_source  (02) ┐
#    ├─ stage_second_source (02) │
#    ├─ stage_third_source  (02) ├─► vehicle_listings (03)
#    ├─ stage_fourth_source (02) │
#    └─ brand_lookup        (02) ┘
#
# Job parameters are passed to every notebook task as widgets of the same name; a notebook without such a
# widget ignores it (only 01 reads `sources`). The UI does not allow task-level parameters next to job
# parameters, so `sources` is a job parameter: it describes the whole Job.
# The cluster id is the existing all-purpose cluster used-cars-cluster (not a secret). No schedule here: the
# Job is started by the ADF pipeline pl_daily_master (see documentation/orchestration.md).

resources:
  jobs:
    silver_vehicle_listings:
      name: silver_vehicle_listings
      tasks:
        - task_key: validate_landing_and_bronze
          notebook_task:
            notebook_path: ../notebooks/01_validate_landing_and_bronze
          existing_cluster_id: 1102-161746-o0vfiwmq

        - task_key: stage_first_source
          depends_on:
            - task_key: validate_landing_and_bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver_stage_first_source
          existing_cluster_id: 1102-161746-o0vfiwmq

        - task_key: stage_second_source
          depends_on:
            - task_key: validate_landing_and_bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver_stage_second_source
          existing_cluster_id: 1102-161746-o0vfiwmq

        - task_key: stage_third_source
          depends_on:
            - task_key: validate_landing_and_bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver_stage_third_source
          existing_cluster_id: 1102-161746-o0vfiwmq

        - task_key: stage_fourth_source
          depends_on:
            - task_key: validate_landing_and_bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver_stage_fourth_source
          existing_cluster_id: 1102-161746-o0vfiwmq

        - task_key: brand_lookup
          depends_on:
            - task_key: validate_landing_and_bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver_brand_lookup
          existing_cluster_id: 1102-161746-o0vfiwmq

        # Runs only when all four source tasks and the brand lookup succeeded (default run_if: ALL_SUCCESS),
        # so a failed source never produces an incomplete vehicle_listings table.
        - task_key: vehicle_listings
          depends_on:
            - task_key: stage_first_source
            - task_key: stage_second_source
            - task_key: stage_third_source
            - task_key: stage_fourth_source
            - task_key: brand_lookup
          notebook_task:
            notebook_path: ../notebooks/03_silver_vehicle_listings
          existing_cluster_id: 1102-161746-o0vfiwmq

      # A run started while another is active waits in the queue instead of running in parallel
      # (two runs would overwrite the same Delta tables).
      queue:
        enabled: true

      parameters:
        - name: dev_mode
          default: "false"
        - name: ingestion_date
          default: latest
        - name: sources
          default: vehicle_listings
