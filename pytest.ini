[pytest]
testpaths = tests
pythonpath = tests .
addopts = -ra -m "not slow and not cdc_integration"
markers =
    slow: another full notebook or pipeline run on the sample; covered in the fast set by a cheaper test (run with -m "slow or not slow")
    cdc_integration: end-to-end CDC demo against the Docker PostgreSQL (opt-in: CDC_INTEGRATION=1)
filterwarnings =
    ignore::DeprecationWarning
